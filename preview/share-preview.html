<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bowl — Share Modal Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-display: "Reenie Beanie", cursive;
      --color-coconut-brown: #4c3125;
      --color-ink-deep: #24150f;
      --color-durian-glow: #d7df68;
    }
    html, body { width: 100%; min-height: 100%; background: #1a1008; font-family: var(--font-display); -webkit-font-smoothing: antialiased; }
    .scene { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, #87ceeb 0%, #b8e4f0 38%, #d4a96a 58%, #a86e50 100%); opacity: 0.4; }
    .backdrop { position: relative; min-height: 100vh; background: radial-gradient(circle at 50% 34%, rgba(42,31,24,0.42), rgba(42,31,24,0.66)); display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px; gap: 56px; flex-wrap: wrap; }

    .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .col-label { font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(244,235,217,0.4); }

    /* ── shared card shell ── */
    .card {
      position: relative; isolation: isolate; display: grid;
      width: min(520px, calc(100vw - 64px));
      padding: 34px 38px 32px;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background-image: url("../assets/ui/shapes/cream-card-blob.svg");
      background-size: 100% 100%; background-repeat: no-repeat;
      filter: drop-shadow(0 30px 56px rgba(0,0,0,0.44));
    }

    /* shared atoms */
    .stamp { position: absolute; top: 22px; right: 36px; width: 96px; height: 96px; padding: 6px; border: 2.5px dashed rgba(76,49,37,0.62); border-radius: 6px; display: grid; place-items: center; transform: rotate(8deg); font-family: var(--font-display); color: rgba(76,49,37,0.7); text-align: center; line-height: 1; pointer-events: none; }
    .stamp span { display: block; }
    .stamp span:nth-child(1) { font-size: 1.8rem; margin-bottom: 2px; }
    .stamp span:nth-child(2) { font-size: 2.8rem; line-height: 0.84; }
    .stamp span:nth-child(3) { font-size: 1.2rem; margin-top: 4px; opacity: 0.7; }

    .close-btn { position: absolute; top: -6px; left: -6px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(244,235,217,0.92); box-shadow: 0 6px 14px rgba(0,0,0,0.22); display: grid; place-items: center; cursor: pointer; font-family: var(--font-display); color: var(--color-coconut-brown); }
    .close-btn span { font-size: 2.8rem; line-height: 1; transform: translateY(-1px); display: block; }

    .divider { height: 1px; background-image: radial-gradient(circle, rgba(76,49,37,0.55) 1px, transparent 1.4px); background-size: 12px 2px; background-repeat: repeat-x; }

    .score-blob { width: 132px; height: 132px; background-image: url("../assets/ui/shapes/score-blob-dark.svg"); background-size: 100% 100%; background-repeat: no-repeat; display: grid; place-items: center; flex-shrink: 0; filter: drop-shadow(0 12px 22px rgba(42,31,24,0.34)); transform: rotate(-4deg); }
    .score-inner { display: grid; justify-items: center; }
    .score-label { font-family: var(--font-display); font-size: 1.8rem; color: rgba(244,235,217,0.78); display: block; text-align: center; }
    .score-num { font-family: var(--font-display); font-size: 5.6rem; line-height: 0.84; color: var(--color-durian-glow); display: block; text-align: center; }

    .preview { border-radius: 50% 47% 49% 51% / 45% 52% 48% 55%; background: rgba(201,202,206,0.22) center/cover no-repeat; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08), 0 18px 34px rgba(42,31,24,0.12); overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .btn { position: relative; isolation: isolate; border: 0; cursor: pointer; background: transparent; font-family: var(--font-display); color: var(--color-coconut-brown); flex: 1; min-height: 96px; font-size: clamp(2rem, 4vw, 3rem); }
    .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: url("../assets/ui/shapes/large-green-blob.svg"); background-size: 100% 100%; background-repeat: no-repeat; }
    .btn--primary { color: var(--color-ink-deep); }

    .doodle { position: absolute; bottom: 18px; left: 22px; pointer-events: none; opacity: 0.55; }

    /* ── CURRENT ── */
    .current { gap: 14px; }
    .current .heading { margin-right: 110px; }
    .current .title { font-size: clamp(3.4rem, 5vw, 5.6rem); line-height: 0.86; color: var(--color-coconut-brown); font-weight: 400; }
    .current .copy { margin-top: 6px; font-size: clamp(1.6rem, 2.2vw, 2.2rem); line-height: 1; color: rgba(96,70,53,0.78); max-width: 20ch; }
    .current .main { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .current .preview { flex: 1; aspect-ratio: 1; max-width: 200px; }
    .current .actions { display: flex; gap: 16px; }

  /* ── PROPOSED — simple, centered, no stamp, no score, no close ── */
  .proposed .heading,
.proposed .main,
.proposed .actions {
  transform: translateX(-14px);
}
.proposed {
  gap: 0;
  padding: 42px 42px 38px;
  min-height: 580px;
  align-content: start;
}

.proposed .close-btn,
.proposed .doodle,
.proposed .stamp,
.proposed .score-blob {
  display: none;
}

.proposed .heading {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 64px 0;
}

.proposed .title {
  font-size: clamp(3.7rem, 5vw, 5.3rem);
  line-height: 0.88;
  color: var(--color-coconut-brown);
  font-weight: 400;
}

.proposed .copy {
  margin-top: 16px;
  font-size: clamp(1.5rem, 2vw, 1.95rem);
  line-height: 1.05;
  color: rgba(96,70,53,0.78);
  text-align: center;
  max-width: 18ch;
}

.proposed .divider {
  display: none;
}

.proposed .main {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 56px;
}

.proposed .preview {
  width: 178px;
  height: 178px;
}

.proposed .preview svg {
  width: 142px;
  height: 142px;
}

.proposed .actions {
  display: flex;
  gap: 18px;
  margin-top: auto;
  padding-top: 34px;
}

.proposed .btn {
  min-height: 78px;
  font-size: clamp(1.95rem, 3vw, 2.5rem);
}
  </style>
</head>
<body>
<div class="scene"></div>
<div class="backdrop">

  <!-- CURRENT (live game, untouched) -->
  <div class="col">
    <div class="col-label">Current</div>
    <div class="card current">
      <div class="stamp"><span>from a</span><span>BOWL</span><span>· est ·</span></div>
      <button class="close-btn"><span>×</span></button>
      <div class="heading">
        <div class="title">what a bowl!</div>
        <div class="copy">a bowl of fruits should never be eaten alone</div>
      </div>
      <div class="divider"></div>
      <div class="main">
        <div class="score-blob"><div class="score-inner"><span class="score-label">score</span><span class="score-num">184</span></div></div>
        <div class="preview">
          <svg viewBox="0 0 200 200" width="165" height="165" xmlns="http://www.w3.org/2000/svg" opacity="0.5">
            <ellipse cx="100" cy="132" rx="72" ry="32" fill="#826248"/>
            <ellipse cx="100" cy="122" rx="76" ry="36" fill="none" stroke="#4c3125" stroke-width="5"/>
            <circle cx="68"  cy="108" r="24" fill="#2a8a4e"  stroke="#4c3125" stroke-width="3"/>
            <circle cx="106" cy="98"  r="28" fill="#f0b41c"  stroke="#4c3125" stroke-width="3"/>
            <circle cx="140" cy="112" r="20" fill="#d81b7a"  stroke="#4c3125" stroke-width="3"/>
            <circle cx="80"  cy="88"  r="16" fill="#c1121f"  stroke="#4c3125" stroke-width="2.5"/>
          </svg>
        </div>
      </div>
      <div class="actions">
        <button class="btn">Again</button>
        <button class="btn btn--primary">Share</button>
      </div>
      <svg class="doodle" width="38" height="38" viewBox="0 0 40 40" fill="none" stroke="#4c3125" stroke-width="2.4" stroke-linecap="round">
        <path d="M6 30 C 14 26, 22 24, 32 24"/><path d="M16 26 C 18 22, 22 20, 26 20"/>
      </svg>
    </div>
  </div>

  <!-- PROPOSED (no stamp, centered, no score, centered bowl) -->
  <div class="col">
    <div class="col-label">Proposed</div>
    <div class="card proposed">
      <button class="close-btn"><span>×</span></button>
      <div class="heading">
        <div class="title">what a bowl!</div>
        <div class="copy">a bowl of fruits should never be eaten alone</div>
      </div>
      <div class="divider"></div>
      <div class="main">
        <div class="preview">
          <svg viewBox="0 0 200 200" width="165" height="165" xmlns="http://www.w3.org/2000/svg" opacity="0.5">
            <ellipse cx="100" cy="132" rx="72" ry="32" fill="#826248"/>
            <ellipse cx="100" cy="122" rx="76" ry="36" fill="none" stroke="#4c3125" stroke-width="5"/>
            <circle cx="68"  cy="108" r="24" fill="#2a8a4e"  stroke="#4c3125" stroke-width="3"/>
            <circle cx="106" cy="98"  r="28" fill="#f0b41c"  stroke="#4c3125" stroke-width="3"/>
            <circle cx="140" cy="112" r="20" fill="#d81b7a"  stroke="#4c3125" stroke-width="3"/>
            <circle cx="80"  cy="88"  r="16" fill="#c1121f"  stroke="#4c3125" stroke-width="2.5"/>
          </svg>
        </div>
      </div>
      <div class="actions">
        <button class="btn">Again</button>
        <button class="btn btn--primary">Share</button>
      </div>
      <svg class="doodle" width="38" height="38" viewBox="0 0 40 40" fill="none" stroke="#4c3125" stroke-width="2.4" stroke-linecap="round">
        <path d="M6 30 C 14 26, 22 24, 32 24"/><path d="M16 26 C 18 22, 22 20, 26 20"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
