<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bowl — Design Kit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-display: "Reenie Beanie", cursive;
      --font-body: Georgia, "Times New Roman", serif;
      --color-coconut-cream:  #f4ebd9;
      --color-coconut-brown:  #4c3125;
      --color-ink-deep:       #24150f;
      --color-hibiscus:       #d94423;
      --color-evening-amber:  #e6a85c;
      --color-muted-brown:    #8a7a6d;
      --color-durian-glow:    #d7df68;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--color-coconut-brown); }
    #app { width: 100%; height: 100vh; }

    @keyframes bowl-enter {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes bowl-breathe {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50%       { transform: scale(1.015) rotate(0.4deg); }
    }
    @keyframes bowl-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes sun-pulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1);     opacity: 1; }
      50%       { transform: translate(-50%,-50%) scale(1.06);  opacity: 0.88; }
    }
    @keyframes cloud-drift-a {
      from { transform: translateX(0); }
      to   { transform: translateX(1600px); }
    }
    @keyframes cloud-drift-b {
      from { transform: translateX(-400px); }
      to   { transform: translateX(1600px); }
    }
    @keyframes palm-sway {
      0%, 100% { transform: rotate(0deg); }
      35%       { transform: rotate(1.2deg); }
      65%       { transform: rotate(-0.8deg); }
    }
    @keyframes gull-drift {
      from { transform: translateX(-320px); }
      to   { transform: translateX(1800px); }
    }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

function CloudShape({ x, y, scale = 1, opacity = 0.94 }) {
  return (
    <g transform={`translate(${x} ${y}) scale(${scale})`} opacity={opacity}>

      <ellipse cx="-50" cy="6" rx="38" ry="18"/>
      <ellipse cx="40" cy="-4" rx="42" ry="22"/>
      <ellipse cx="-20" cy="-14" rx="34" ry="18"/>
      <ellipse cx="20" cy="-18" rx="30" ry="16"/>
      <ellipse cx="70" cy="8" rx="28" ry="14"/>
      <ellipse cx="-78" cy="2" rx="22" ry="12"/>
    </g>
  );
}

function FrondShape({ cx, cy, dx, dy }) {
  const tx = cx + dx, ty = cy + dy;
  const mx = cx + dx * 0.5, my = cy + dy * 0.5;
  const perp = dx > 0 ? 1 : -1;
  return <path d={`M ${cx} ${cy} Q ${mx + Math.abs(dy)*0.2*perp} ${my - 16} ${tx} ${ty} Q ${mx - Math.abs(dy)*0.1*perp} ${my + 14} ${cx} ${cy} Z`}/>;
}

function PalmShape({ x, baseY, height, bend, fill }) {
  const top = baseY - height;
  const cpx = x + bend * 30, cpy = baseY - height * 0.5;
  return (
    <g>
      <path d={`M ${x-10} ${baseY} Q ${cpx-6} ${cpy} ${x + bend*40 - 6} ${top}`} fill="none" stroke={fill} strokeWidth="14" strokeLinecap="round"/>
      <path d={`M ${x+10} ${baseY} Q ${cpx+6} ${cpy} ${x + bend*40 + 6} ${top}`} fill="none" stroke={fill} strokeWidth="14" strokeLinecap="round"/>
      <circle cx={x + bend*40 - 8} cy={top + 8} r="6" fill={fill}/>
      <circle cx={x + bend*40 + 12} cy={top + 14} r="6" fill={fill}/>
      <circle cx={x + bend*40 + 2} cy={top + 22} r="6" fill={fill}/>
      <g fill={fill} stroke="#1a0e08" strokeWidth="2" strokeLinejoin="round">
        <FrondShape cx={x + bend*40} cy={top} dx={-160} dy={-30}/>
        <FrondShape cx={x + bend*40} cy={top} dx={160} dy={-30}/>
        <FrondShape cx={x + bend*40} cy={top} dx={-130} dy={60}/>
        <FrondShape cx={x + bend*40} cy={top} dx={130} dy={60}/>
        <FrondShape cx={x + bend*40} cy={top} dx={-30} dy={-80}/>
        <FrondShape cx={x + bend*40} cy={top} dx={30} dy={-80}/>
      </g>
    </g>
  );
}

function GullShape({ x, y, scale, fill }) {
  return (
    <g transform={`translate(${x} ${y}) scale(${scale})`} fill="none" stroke={fill} strokeWidth="3" strokeLinecap="round">
      <path d="M-22 0 Q -12 -10 0 0 Q 12 -10 22 0"/>
    </g>
  );
}

}

      {/* ── SHARE (combined post-game + share) ── */}
      {screen === 'share' && (
        <ShareOverlay score={score} fruits={BOWL_FRUITS} onAgain={() => setScreen('mode')}/>
      )}

      <ScreenPicker screen={screen} setScreen={setScreen}/>

      <window.TweaksPanel title="Tweaks" defaultOpen={false}>
        <window.TweakSection title="Opening scene">
          <window.TweakRadio label="time of day" value={sceneTime} onChange={(v) => setTweak('sceneTime', v)}
            options={[{ value: 'noon', label: 'noon' }, { value: 'goldenHour', label: 'golden' }, { value: 'dusk', label: 'dusk' }]}/>
          <window.TweakToggle label="animation" value={animateScene} onChange={(v) => setTweak('animateScene', v)}/>
        </window.TweakSection>
        <window.TweakSection title="Fruits">
          <window.TweakToggle label="illustrated" value={fruitsIllustrated} onChange={(v) => setTweak('fruitsIllustrated', v)}/>
          <window.TweakToggle label="show sliced" value={showSliced} onChange={(v) => setTweak('showSliced', v)}/>
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

</body>
</html>
